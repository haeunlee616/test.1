<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Failure, Your Re:Definition</title>
<link rel="stylesheet" href="home.css">
</head>
<body>

  <!-- 배경: 컬러 단어 박스가 위에서 아래로 계속 흘러내림 (책보다 뒤) -->
  <div class="words" aria-hidden="true">
    <div class="strip">
      <div class="track">
        <span class="word c-cyan   l" style="--x:474;  --row:0">실수</span>
        <span class="word c-green  r" style="--x:1293; --row:0">탈락</span>
        <span class="word c-green  l" style="--x:80;   --row:1">실패</span>
        <span class="word c-lilac  r" style="--x:899;  --row:1">불발</span>
        <span class="word c-lilac  l" style="--x:297;  --row:2">좌절</span>
        <span class="word c-pink   r" style="--x:1116; --row:2">고배</span>
        <span class="word c-yellow l" style="--x:152;  --row:3">패배</span>
        <span class="word c-cyan   r" style="--x:971;  --row:3">착오</span>
        <span class="word c-pink   l" style="--x:361;  --row:4">낙방</span>
        <span class="word c-orange r" style="--x:1180; --row:4">허탈</span>
        <span class="word c-orange l" style="--x:245;  --row:5">낭패</span>
        <span class="word c-yellow r" style="--x:1064; --row:5">무산</span>
      </div>
      <div class="track">
        <span class="word c-cyan   l" style="--x:474;  --row:0">실수</span>
        <span class="word c-green  r" style="--x:1293; --row:0">탈락</span>
        <span class="word c-green  l" style="--x:80;   --row:1">실패</span>
        <span class="word c-lilac  r" style="--x:899;  --row:1">불발</span>
        <span class="word c-lilac  l" style="--x:297;  --row:2">좌절</span>
        <span class="word c-pink   r" style="--x:1116; --row:2">고배</span>
        <span class="word c-yellow l" style="--x:152;  --row:3">패배</span>
        <span class="word c-cyan   r" style="--x:971;  --row:3">착오</span>
        <span class="word c-pink   l" style="--x:361;  --row:4">낙방</span>
        <span class="word c-orange r" style="--x:1180; --row:4">허탈</span>
        <span class="word c-orange l" style="--x:245;  --row:5">낭패</span>
        <span class="word c-yellow r" style="--x:1064; --row:5">무산</span>
      </div>
    </div>
  </div>

  <!-- 중앙 책 (단어 박스보다 앞) -->
  <main class="stage">
    <div class="book-shadow" aria-hidden="true"></div>
    <div class="rig">
      <div class="book-wall-shadow" aria-hidden="true"></div>
      <div class="book-pose">
      <div class="book3d">
        <!-- 책의 두께: 뒷표지, 책등, 오른쪽·위·아래 책장 옆면 (책이 열리면 사라짐) -->
        <div class="bk bk-back" aria-hidden="true"></div>
        <div class="bk bk-spine" aria-hidden="true"></div>
        <div class="bk bk-edge-r" aria-hidden="true"></div>
        <div class="bk bk-edge-t" aria-hidden="true"></div>
        <div class="bk bk-edge-b" aria-hidden="true"></div>
        <div class="page-right"><img src="assets/spread-right.png" alt=""></div>
        <div class="page-next"><img src="assets/spread-blank-right.png" alt=""></div>
        <div class="cover">
          <div class="cover__face cover__front">
            <img class="book" src="assets/book.png" alt="실패사전 — Failure Dictionary">
          </div>
          <div class="cover__face cover__back">
            <img src="assets/spread-blank-left.png" alt="">
          </div>
        </div>
        <!-- 넘어가는 장: 모서리부터 들려 대각선으로 접히며 말려 넘어감 (home.js 가 안쪽을 채움) -->
        <div class="leaf leaf-1" data-front="assets/face-right-def.png" data-back="assets/face-left-blank.png"></div>
        <div class="page-copy">
          <div class="page-text page-title" id="page-title">Redefine your failure.</div>
          <div class="page-text page-sub" id="page-sub">What does failure mean to you?</div>
        </div>
      </div>
      </div>
    </div>
  </main>

  <!-- 책이 펼쳐진 뒤 나타나는 문구 -->
  <section class="caption">
    <p class="caption__term" id="caption-term">failure:</p>
    <p class="caption__def" aria-label="(1) the fact of someone or something not succeeding">
      <span class="caption__ghost" aria-hidden="true">(1) the fact of someone or something not succeeding</span>
      <span class="caption__typed" id="typed" aria-hidden="true"></span>
    </p>
  </section>

  <!-- 상단 고정 -->
  <header class="top">
    <a class="nav nav--left" href="#contact" id="contact-btn">contact</a>
    <a class="logo-link" href="./" id="logo-link" aria-label="처음 화면으로">
      <img class="logo" src="assets/logo.png" alt="failure your Re:Definition">
    </a>
    <a class="nav nav--right" href="#about" id="about-btn">about</a>
  </header>

  <a class="open" href="#open" id="open-btn">
    <span class="open__label">CLICK TO OPEN</span>
    <img class="open__hand" src="assets/hand.png" alt="">
  </a>

  <!-- 하단 검정 바 (위치 고정) -->
  <footer class="bar">
    <img src="assets/icon-crawl.png" alt="" class="bar__icon bar__icon--crawl">
    <img src="assets/icon-book.png"  alt="" class="bar__icon bar__icon--book">
    <img src="assets/icon-pen.png"   alt="" class="bar__icon bar__icon--pen">
  </footer>

  <!-- 손으로 그린 듯한 울퉁불퉁한 테두리용 필터 (설문의 박스·질문 번호) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- 설문 화면: 화면 아래에서 올라오는 레이어 (질문 7개, 질문마다 내용이 바뀜) -->
  <div class="survey-layer" id="survey-layer" data-bg="f1">
    <section class="survey" id="survey" aria-hidden="true" data-q="1" data-theme="black">
      <div class="survey__deco" id="deco" aria-hidden="true" hidden></div>

      <div class="survey__q" id="survey-q">
        <div class="survey__badge" id="survey-badge">Q1</div>
        <h2 class="survey__title" id="survey-title"></h2>
        <p class="survey__sub" id="survey-sub"></p>
      </div>

      <!-- 글로 답하는 질문 -->
      <div class="survey__answer" id="answer-box" hidden>
        <textarea id="answer" aria-label="답변" spellcheck="false"></textarea>
      </div>
      <div class="survey__count" id="count" aria-live="polite" hidden>(0/200)</div>

      <!-- 박스를 골라서 답하는 질문 -->
      <div class="survey__choices" id="choices" hidden></div>

      <!-- 당시 / 지금 색 고르기 -->
      <div class="survey__colors" id="colors" hidden></div>

      <!-- 나만의 이름과 뜻풀이 -->
      <div class="survey__define" id="define" hidden></div>

      <div class="survey__bar" role="progressbar" aria-label="설문 진행도" aria-valuemin="0" aria-valuemax="100" id="survey-bar">
        <div class="survey__bar-fill" id="bar-fill"></div>
      </div>
      <button class="survey__next" id="next-btn" type="button" disabled>Next</button>
    </section>
  </div>

  <a class="start" href="#start" id="start-btn">Let’s start</a>

  <!-- 커서를 따라다니는 단어 박스 -->
  <div class="trail" id="trail" aria-hidden="true"></div>

  <script src="home.js"></script>
  <script src="survey.js"></script>
</body>
</html>
